<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sotto — 5 full experiences</title>
<style>
  :root { --orange: #ff9f1c; --gold: #ffcc59; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "SF Pro Rounded", BlinkMacSystemFont, sans-serif;
    height: 100vh; overflow: hidden;
    background:
      radial-gradient(1100px 600px at 15% 0%, #1d2440 0%, transparent 60%),
      radial-gradient(900px 700px at 85% 30%, #33203c 0%, transparent 55%),
      #0e0e14;
    color: #fff;
  }
  .tabs {
    position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; z-index: 20;
  }
  .tabs button {
    padding: 8px 16px; border: 1px solid rgba(255,255,255,.14); border-radius: 99px;
    background: rgba(16,16,22,.8); color: rgba(255,255,255,.65);
    font-size: 12px; font-weight: 800; cursor: pointer;
  }
  .tabs button.active { background: var(--orange); color: #14140f; border-color: var(--orange); }
  #variantDesc {
    position: absolute; top: 58px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: rgba(255,255,255,.45); z-index: 20; white-space: nowrap;
  }

  .doc {
    position: absolute; inset: 92px 340px 140px 60px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 14px; padding: 34px 38px;
    font-size: 16px; line-height: 1.7; color: rgba(255,255,255,.75);
  }
  .doc h3 { font-size: 13px; letter-spacing: 1px; color: rgba(255,255,255,.35); margin-bottom: 14px; }
  #typed { color: var(--gold); }
  #typed .w { opacity: 0; transition: opacity .18s; }
  #typed .w.on { opacity: 1; }
  .caret {
    display: inline-block; width: 2px; height: 1.15em; background: var(--gold);
    vertical-align: text-bottom; animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .panel {
    position: absolute; top: 92px; right: 40px; width: 264px;
    background: rgba(16,16,22,.9); border: 1px solid rgba(255,255,255,.1);
    border-radius: 14px; padding: 16px; font-size: 12px; z-index: 20;
  }
  .panel h3 { font-size: 12px; color: var(--gold); margin: 10px 0 6px; }
  .panel h3:first-child { margin-top: 0; }
  .panel .row { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
  .panel label { flex: 0 0 92px; color: rgba(255,255,255,.6); }
  .panel input[type=range] { flex: 1; accent-color: var(--orange); }
  .panel output { width: 40px; text-align: right; color: rgba(255,255,255,.8); }
  .panel .hint { color: rgba(255,255,255,.4); margin-top: 10px; line-height: 1.5; }
  .panel button {
    width: 100%; margin-top: 12px; padding: 9px; border: 0; border-radius: 9px;
    background: var(--orange); color: #14140f; font-weight: 800; font-size: 13px; cursor: pointer;
  }
  .panel .check { display: flex; gap: 6px; align-items: center; margin-top: 8px; color: rgba(255,255,255,.6); }

  #pill {
    position: absolute; bottom: 72px; left: 50%;
    transform: translateX(-50%) scale(.6); opacity: 0;
    display: flex; align-items: center; gap: 11px;
    padding: 11px 21px; min-height: 46px;
    border-radius: 999px;
    background: rgba(18,18,24,.55);
    backdrop-filter: blur(28px) saturate(1.5);
    -webkit-backdrop-filter: blur(28px) saturate(1.5);
    box-shadow: 0 10px 30px rgba(0,0,0,.45);
    font-size: 14px; font-weight: 600; color: rgba(255,255,255,.88);
    transition: opacity .26s cubic-bezier(.2,1.4,.4,1), transform .26s cubic-bezier(.2,1.4,.4,1),
                padding .24s cubic-bezier(.55,0,.25,1.15), min-height .24s cubic-bezier(.55,0,.25,1.15),
                width .24s cubic-bezier(.55,0,.25,1.15), height .24s cubic-bezier(.55,0,.25,1.15), gap .24s,
                background .24s, box-shadow .24s;
    white-space: nowrap;
  }
  #pill.on { opacity: 1; transform: translateX(-50%) scale(1); }
  #pill > span { transition: opacity .15s ease-in, transform .15s cubic-bezier(.6,0,.9,.5); }
  #pill.merge > span { opacity: 0; transform: scale(.2); }
  #pill.orb {
    padding: 0; gap: 0; min-height: 0;
    width: 42px; height: 42px; overflow: hidden;
    background: radial-gradient(circle at 38% 32%, var(--gold), var(--orange) 55%, #b35c00);
    box-shadow: 0 0 18px 4px rgba(255,159,28,.55), 0 0 60px 14px rgba(255,159,28,.25);
    animation: orbPulse 1s ease-in-out infinite;
  }
  #pill.charge { animation: charge .5s ease-in infinite alternate; }
  #pill.pop { animation: orbPop .32s cubic-bezier(.2,1.6,.4,1) forwards; }
  #pill.squash { animation: squash .28s cubic-bezier(.6,0,.9,1) forwards; }
  @keyframes orbPulse {
    0%,100% { box-shadow: 0 0 14px 3px rgba(255,159,28,.45), 0 0 44px 10px rgba(255,159,28,.2); }
    50% { box-shadow: 0 0 24px 7px rgba(255,159,28,.7), 0 0 80px 20px rgba(255,159,28,.32); }
  }
  @keyframes charge {
    from { transform: translateX(-50%) scale(1); filter: brightness(1); }
    to { transform: translateX(-50%) scale(1.22); filter: brightness(1.35); }
  }
  @keyframes orbPop { to { transform: translateX(-50%) scale(.15); opacity: 0; } }
  @keyframes squash {
    40% { transform: translateX(-50%) scale(1.35, .6); }
    100% { transform: translateX(-50%) scale(0, 0); opacity: 0; }
  }
  #pill svg.rim { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; transition: opacity .14s ease-in; }
  #pill svg.rim rect { fill: none; stroke-linecap: round; }
  #wavebox { display: flex; align-items: center; gap: 2.5px; height: 26px; }
  #wavebox i {
    width: 3px; border-radius: 99px; flex: 0 0 3px;
    background: linear-gradient(0deg, var(--orange), var(--gold));
    transition: height .05s linear;
  }

  .fx { position: absolute; pointer-events: none; }
  #beam {
    height: 2.5px; transform-origin: 0 50%;
    background: linear-gradient(90deg, rgba(255,159,28,0), var(--gold), rgba(255,204,89,0));
    filter: drop-shadow(0 0 6px var(--orange)); opacity: 0;
  }
  .photon {
    position: absolute; width: 10px; height: 10px; border-radius: 50%;
    background: radial-gradient(circle, #fff, var(--gold) 45%, var(--orange));
    box-shadow: 0 0 12px 4px rgba(255,159,28,.8); pointer-events: none;
  }
  #impact {
    width: 8px; height: 8px; border-radius: 50%;
    border: 2px solid var(--gold); opacity: 0;
  }
  .impacting { animation: ring .45s ease-out forwards; }
  @keyframes ring { from { transform: scale(.4); opacity: .95; } to { transform: scale(5); opacity: 0; } }
  #flash {
    width: 90px; height: 90px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.95), rgba(255,204,89,.6) 40%, rgba(255,159,28,0) 70%);
    opacity: 0;
  }
  .flashing { animation: flash .3s ease-out forwards; }
  @keyframes flash { from { transform: scale(.2); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }
  .hint-chip {
    position: absolute; bottom: 126px; left: 50%; transform: translateX(-50%);
    padding: 5px 12px; border-radius: 99px; font-size: 12px; font-weight: 700;
    background: rgba(18,18,24,.7); color: rgba(255,255,255,.75);
    backdrop-filter: blur(10px); opacity: 0; transition: opacity .2s; z-index: 5;
  }
</style>
</head>
<body>
  <div class="tabs" id="tabs"></div>
  <div id="variantDesc"></div>

  <div class="doc">
    <h3>MOCK DOCUMENT — transmission lands at the caret</h3>
    <p>notes on the axia launch, dictated with sotto: <span id="typed"></span><span class="caret" id="caret"></span></p>
  </div>

  <div class="panel">
    <h3>RUN</h3>
    <button id="go">▶ Start (or press Space)</button>
    <div class="hint">Space = tap hotkey. Speak, Space again to stop. Real mic if granted; synthetic wave otherwise.</div>
    <div class="check"><input type="checkbox" id="sound" checked><label for="sound">sounds</label></div>
    <h3>WAVE FEEL</h3>
    <div class="row"><label>Gain</label><input type="range" id="gain" min="1" max="20" step=".5" value="7"><output id="gainO">7</output></div>
    <div class="row"><label>Curve</label><input type="range" id="curve" min=".3" max="1.6" step=".05" value=".75"><output id="curveO">.75</output></div>
    <div class="row"><label>Auto-level</label><input type="range" id="agc" min="0" max="1" step=".05" value=".6"><output id="agcO">.6</output></div>
    <div class="row"><label>Scroll</label><input type="range" id="scroll" min="1" max="6" step="1" value="2"><output id="scrollO">2</output></div>
    <h3>MOTION</h3>
    <div class="row"><label>Beam (ms)</label><input type="range" id="beamT" min="150" max="1400" step="10" value="420"><output id="beamTO">420</output></div>
    <div class="row"><label>Type speed</label><input type="range" id="typeT" min="4" max="40" step="1" value="14"><output id="typeTO">14</output></div>
  </div>

  <div id="pill">
    <svg class="rim"></svg>
    <span id="wavebox"></span>
    <span id="ptext">Listening</span>
  </div>
  <div class="fx" id="beam"></div>
  <div class="fx" id="impact"></div>
  <div class="fx" id="flash"></div>

<script>
  const $ = id => document.getElementById(id);
  for (const id of ["gain","curve","agc","scroll","beamT","typeT"])
    $(id).addEventListener("input", () => $(id + "O").textContent = $(id).value);

  const TEXT = "okay so the thing about the launch is that distribution beats product every single time";

  // ---------------- audio helpers ----------------
  let actx;
  const AC = () => actx ??= new AudioContext();
  function tone(freqs, dur, type = "sine", gain = 0.12, delay = 0) {
    if (!$("sound").checked) return;
    const t0 = AC().currentTime + delay;
    const g = AC().createGain();
    g.gain.setValueAtTime(gain, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    g.connect(AC().destination);
    const o = AC().createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(freqs[0], t0);
    freqs.slice(1).forEach((f, i) => o.frequency.exponentialRampToValueAtTime(f, t0 + dur * (i + 1) / (freqs.length - 1)));
    o.connect(g); o.start(t0); o.stop(t0 + dur);
  }
  function whoosh(dur = .4, gain = .18) {
    if (!$("sound").checked) return;
    const t0 = AC().currentTime;
    const n = AC().createBufferSource();
    const buf = AC().createBuffer(1, AC().sampleRate * dur, AC().sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    n.buffer = buf;
    const f = AC().createBiquadFilter();
    f.type = "bandpass"; f.Q.value = 1.2;
    f.frequency.setValueAtTime(400, t0);
    f.frequency.exponentialRampToValueAtTime(3200, t0 + dur);
    const g = AC().createGain(); g.gain.value = gain;
    n.connect(f); f.connect(g); g.connect(AC().destination);
    n.start(t0);
  }

  // ---------------- variants ----------------
  const variants = [
    {
      name: "V1 · Photon", desc: "the one you loved: chirp → orb → laser beam → photon → impact ring → type",
      ack: () => { tone([520, 880, 1320], .16, "sine", .1); tone([260, 440], .12, "triangle", .06); },
      stop: () => tone([880, 620], .12, "sine", .08),
      transmit: ctxTransmitBeam,
      type: "chars",
    },
    {
      name: "V2 · Comet", desc: "orb CHARGES then launches itself in an arc to the caret, whoosh + splash",
      ack: () => { tone([180, 320], .3, "triangle", .09); tone([720, 1080], .14, "sine", .07, .08); },
      stop: () => tone([560, 340], .16, "triangle", .09),
      transmit: ctxTransmitComet,
      type: "chars",
    },
    {
      name: "V3 · Datastream", desc: "a rail draws to the caret, photons stream down it WHILE the words arrive",
      ack: () => { [660, 880, 1100].forEach((f, i) => tone([f], .07, "square", .05, i * .05)); },
      stop: () => tone([1100, 880, 660].flat(), .14, "square", .05),
      transmit: ctxTransmitStream,
      type: "stream",
    },
    {
      name: "V4 · Blink", desc: "fastest: orb squashes and TELEPORTS — flash at the caret, words slam in",
      ack: () => { tone([90, 45], .12, "sine", .2); tone([1800, 2600], .08, "sine", .05, .04); },
      stop: () => tone([70, 40], .1, "sine", .18),
      transmit: ctxTransmitBlink,
      type: "words-fast",
    },
    {
      name: "V5 · Stardust", desc: "orb dissolves into a swarm of sparks that arc over and condense into words",
      ack: () => { [1568, 2093, 2637].forEach((f, i) => tone([f], .18, "sine", .04, i * .06)); },
      stop: () => tone([2093, 1568], .2, "sine", .05),
      transmit: ctxTransmitStardust,
      type: "words-fade",
    },
  ];
  let vi = 0;

  const tabs = $("tabs");
  variants.forEach((v, i) => {
    const b = document.createElement("button");
    b.textContent = v.name;
    b.onclick = () => { vi = i; [...tabs.children].forEach((c, j) => c.classList.toggle("active", j === i)); $("variantDesc").textContent = v.desc; };
    tabs.appendChild(b);
  });
  tabs.children[0].classList.add("active");
  $("variantDesc").textContent = variants[0].desc;

  // ---------------- waveform + mic ----------------
  const BARS = 26, wavebox = $("wavebox");
  for (let i = 0; i < BARS; i++) wavebox.appendChild(document.createElement("i"));
  const bars = [...wavebox.children];
  let history = new Array(BARS).fill(0.04);
  let analyser, micData, peak = 0.08, micReal = false;
  async function initMic() {
    if (analyser) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const src = AC().createMediaStreamSource(stream);
      analyser = AC().createAnalyser(); analyser.fftSize = 1024;
      src.connect(analyser);
      micData = new Float32Array(analyser.fftSize);
      micReal = true;
    } catch { micReal = false; }
  }
  function micLevel() {
    if (!analyser) return 0.1 + 0.5 * Math.abs(Math.sin(performance.now() / 180));
    analyser.getFloatTimeDomainData(micData);
    let sum = 0;
    for (let i = 0; i < micData.length; i++) sum += micData[i] * micData[i];
    const rms = Math.sqrt(sum / micData.length);
    peak = Math.max(rms, peak * 0.995, 0.015);
    const agc = parseFloat($("agc").value);
    const norm = (1 - agc) * rms * parseFloat($("gain").value) + agc * (rms / peak);
    return Math.min(1, Math.pow(norm, parseFloat($("curve").value)));
  }

  // ---------------- rim snakes ----------------
  const rim = document.querySelector("#pill svg.rim");
  let snakeLayers = [], snakeL = 0, snakeHead = 0;
  function buildRim() {
    rim.innerHTML = ""; snakeLayers = []; rim.style.opacity = 1;
    const r = $("pill").getBoundingClientRect();
    rim.setAttribute("viewBox", `0 0 ${r.width} ${r.height}`);
    for (const wdt of [4, 1.5]) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      el.setAttribute("x", 1.25); el.setAttribute("y", 1.25);
      el.setAttribute("width", r.width - 2.5); el.setAttribute("height", r.height - 2.5);
      el.setAttribute("rx", (r.height - 2.5) / 2);
      el.setAttribute("stroke-width", wdt);
      el.setAttribute("stroke", wdt > 2 ? "rgba(255,159,28,.5)" : "#ffb347");
      if (wdt > 2) el.setAttribute("filter", "blur(3px)");
      rim.appendChild(el); snakeLayers.push(el);
    }
    snakeL = snakeLayers[0].getTotalLength();
  }

  // ---------------- state machine ----------------
  const pill = $("pill");
  let state = "idle", frame = 0;
  (function loop() {
    frame++;
    if (state === "listening") {
      if (frame % parseInt($("scroll").value) === 0) { history.push(micLevel()); history.shift(); }
      bars.forEach((b, i) => b.style.height = Math.max(3, history[i] * 26) + "px");
      snakeHead = (snakeHead + snakeL / (2.25 * 60)) % snakeL;
      const len = snakeL * 0.18;
      for (const el of snakeLayers) {
        el.setAttribute("stroke-dasharray", `${len} ${snakeL / 2 - len} ${len} ${snakeL / 2 - len}`);
        el.setAttribute("stroke-dashoffset", -(snakeHead - len));
      }
    }
    requestAnimationFrame(loop);
  })();

  async function start() {
    if (state !== "idle") return;
    state = "intro";
    await initMic();
    history = new Array(BARS).fill(0.04);
    $("typed").textContent = "";
    pill.classList.remove("orb", "pop", "squash", "charge", "merge");
    pill.style.opacity = ""; pill.style.transform = ""; pill.style.width = ""; pill.style.height = "";
    wavebox.style.display = "";
    variants[vi].ack();
    pill.classList.add("on");
    requestAnimationFrame(() => requestAnimationFrame(buildRim));
    setTimeout(() => state = "listening", 280);
  }

  function stop() {
    if (state !== "listening") return;
    state = "processing";
    variants[vi].stop();
    // merge: contents get sucked inward, then the shell contracts into the orb.
    // width: auto cannot transition, so lock the current pixel size first.
    const r0 = pill.getBoundingClientRect();
    pill.style.width = r0.width + "px"; pill.style.height = r0.height + "px";
    void pill.offsetWidth;
    pill.classList.add("merge");
    rim.style.opacity = 0;
    tone([900, 320], .16, "sine", .07);
    setTimeout(() => {
      pill.classList.add("orb");
      pill.style.width = "42px"; pill.style.height = "42px";
    }, 110);
    const hint = document.createElement("div");
    hint.className = "hint-chip"; hint.textContent = "Processing…";
    setTimeout(() => {
      document.body.appendChild(hint);
      requestAnimationFrame(() => hint.style.opacity = 1);
    }, 320);
    setTimeout(() => { hint.remove(); state = "beam"; variants[vi].transmit(); }, 720);
  }

  function points() {
    const o = pill.getBoundingClientRect(), c = $("caret").getBoundingClientRect();
    return { x1: o.left + o.width / 2, y1: o.top + o.height / 2, x2: c.left + 1, y2: c.top + c.height / 2 };
  }
  function ringAt(x, y) {
    const impact = $("impact");
    Object.assign(impact.style, { left: x - 4 + "px", top: y - 4 + "px" });
    impact.classList.remove("impacting"); void impact.offsetWidth;
    impact.classList.add("impacting");
  }
  function finish(delay = 400) {
    setTimeout(() => { pill.classList.remove("on", "pop", "orb", "squash", "charge", "merge"); state = "idle"; }, delay);
  }

  // ---------------- transmit styles ----------------
  function ctxTransmitBeam() {
    tone([1600, 300], .3, "sawtooth", .05); tone([2400, 900], .18, "sine", .07);
    const { x1, y1, x2, y2 } = points();
    const dist = Math.hypot(x2 - x1, y2 - y1), ang = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
    const beam = $("beam");
    Object.assign(beam.style, { left: x1 + "px", top: y1 + "px", width: dist + "px", transform: `rotate(${ang}deg)`, opacity: 1 });
    const p = mkPhoton(x1, y1);
    const T = parseInt($("beamT").value);
    p.animate([{ left: x1 - 5 + "px", top: y1 - 5 + "px" }, { left: x2 - 5 + "px", top: y2 - 5 + "px" }],
      { duration: T, easing: "cubic-bezier(.5,0,.8,1)", fill: "forwards" });
    setTimeout(() => {
      p.remove(); beam.style.opacity = 0;
      ringAt(x2, y2); pill.classList.add("pop");
      typeText(); 
    }, T);
  }

  function ctxTransmitComet() {
    pill.classList.add("charge");
    tone([120, 240, 480], .5, "triangle", .12);
    setTimeout(() => {
      pill.classList.remove("charge");
      whoosh(.45, .2);
      const { x1, y1, x2, y2 } = points();
      pill.style.opacity = 0;
      const orb = mkOrb(x1, y1, 42);
      const midX = (x1 + x2) / 2 + 80, midY = Math.min(y1, y2) - 140;
      const T = parseInt($("beamT").value) + 250;
      orb.style.offsetPath = `path('M ${x1} ${y1} Q ${midX} ${midY} ${x2} ${y2}')`;
      orb.animate([
        { offsetDistance: "0%", transform: "scale(1)" },
        { offsetDistance: "100%", transform: "scale(.35)" }],
        { duration: T, easing: "cubic-bezier(.45,0,.6,1)", fill: "forwards" });
      setTimeout(() => {
        orb.remove(); tone([1400, 700], .12, "sine", .09);
        ringAt(x2, y2); $("flash").classList.remove("flashing"); 
        typeText();
      }, T);
      finish(T + 300);
    }, 520);
  }

  function ctxTransmitStream() {
    const { x1, y1, x2, y2 } = points();
    const dist = Math.hypot(x2 - x1, y2 - y1), ang = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
    const beam = $("beam");
    Object.assign(beam.style, { left: x1 + "px", top: y1 + "px", width: "0px", transform: `rotate(${ang}deg)`, opacity: 1, transition: "width .25s ease-out" });
    requestAnimationFrame(() => beam.style.width = dist + "px");
    [0, 1, 2, 3, 4, 5, 6, 7].forEach(i => tone([1200 + (i % 2) * 500], .05, "square", .04, .25 + i * .09));
    const T = parseInt($("beamT").value);
    const words = TEXT.split(" ");
    const perPhoton = Math.max(60, T / 4);
    words.forEach((w, i) => {
      const p = mkPhoton(x1, y1, 7);
      p.animate([{ left: x1 - 4 + "px", top: y1 - 4 + "px" }, { left: x2 - 4 + "px", top: y2 - 4 + "px" }],
        { duration: perPhoton * 2.2, delay: 250 + i * perPhoton, easing: "linear", fill: "forwards" });
      setTimeout(() => {
        p.remove(); appendWord(w, true);
        pill.style.transform = `translateX(-50%) scale(${1 - (i + 1) / words.length * 0.85})`;
      }, 250 + i * perPhoton + perPhoton * 2.2);
    });
    const total = 250 + words.length * perPhoton + perPhoton * 2.2;
    setTimeout(() => { beam.style.opacity = 0; beam.style.transition = ""; ringAt(x2, y2); }, total);
    finish(total + 250);
  }

  function ctxTransmitBlink() {
    pill.classList.add("squash");
    tone([60], .12, "sine", .22); tone([2400, 3600], .1, "sine", .06, .05);
    const { x2, y2 } = points();
    setTimeout(() => {
      const flash = $("flash");
      Object.assign(flash.style, { left: x2 - 45 + "px", top: y2 - 45 + "px" });
      flash.classList.remove("flashing"); void flash.offsetWidth;
      flash.classList.add("flashing");
      ringAt(x2, y2);
      tone([3200, 1600], .14, "sine", .07);
      typeWords(28);
    }, 300);
    finish(500);
  }

  function ctxTransmitStardust() {
    const { x1, y1, x2, y2 } = points();
    pill.style.opacity = 0;
    [2093, 2637, 3136].forEach((f, i) => tone([f], .3, "sine", .035, i * .07));
    const N = 26, T = parseInt($("beamT").value) + 400;
    const parts = [];
    for (let i = 0; i < N; i++) {
      const p = mkPhoton(x1, y1, 3 + Math.random() * 4);
      const spread = 200 * (Math.random() - 0.5);
      const midX = (x1 + x2) / 2 + spread, midY = Math.min(y1, y2) - 90 - Math.random() * 160;
      p.style.offsetPath = `path('M ${x1} ${y1} Q ${midX} ${midY} ${x2} ${y2}')`;
      const anim = p.animate(
        [{ offsetDistance: "0%", opacity: 1 }, { offsetDistance: "100%", opacity: .7 }],
        { duration: T + Math.random() * 350, delay: Math.random() * 220, easing: "cubic-bezier(.4,0,.7,1)", fill: "forwards" });
      anim.onfinish = () => p.remove();
      parts.push(p);
    }
    setTimeout(() => { ringAt(x2, y2); tone([1568, 2093], .25, "sine", .05); typeWords(90, true); }, T + 250);
    finish(T + 400);
  }

  // ---------------- typing styles ----------------
  function typeText() {
    const typed = $("typed");
    let i = 0;
    const iv = setInterval(() => {
      typed.textContent += TEXT[i++];
      if (i >= TEXT.length) { clearInterval(iv); finish(); }
    }, parseInt($("typeT").value));
  }
  function typeWords(interval, fade = false) {
    const words = TEXT.split(" ");
    words.forEach((w, i) => setTimeout(() => appendWord(w, fade), i * interval));
  }
  function appendWord(w, fade) {
    const typed = $("typed");
    const span = document.createElement("span");
    span.className = "w"; span.textContent = (typed.childNodes.length ? " " : "") + w;
    typed.appendChild(span);
    if (fade) requestAnimationFrame(() => span.classList.add("on"));
    else span.classList.add("on");
  }

  // ---------------- fx factories ----------------
  function mkPhoton(x, y, size = 10) {
    const p = document.createElement("div");
    p.className = "photon";
    Object.assign(p.style, { left: x - size / 2 + "px", top: y - size / 2 + "px", width: size + "px", height: size + "px" });
    document.body.appendChild(p);
    return p;
  }
  function mkOrb(x, y, size) {
    const o = document.createElement("div");
    Object.assign(o.style, {
      position: "absolute", left: "0", top: "0", width: size + "px", height: size + "px",
      borderRadius: "50%", pointerEvents: "none",
      background: "radial-gradient(circle at 38% 32%, var(--gold), var(--orange) 55%, #b35c00)",
      boxShadow: "0 0 18px 4px rgba(255,159,28,.55), 0 0 60px 14px rgba(255,159,28,.25)",
      offsetRotate: "0deg",
    });
    document.body.appendChild(o);
    return o;
  }

  $("go").addEventListener("click", () => state === "idle" ? start() : stop());
  document.addEventListener("keydown", e => {
    if (e.code === "Space") { e.preventDefault(); state === "idle" ? start() : stop(); }
  });
</script>
</body>
